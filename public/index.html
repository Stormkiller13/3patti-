<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Royal 3 Patti</title>
  <link rel="stylesheet" href="style.css">
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>

  <!-- Game Table Felt -->
  <div class="poker-table">
    <div class="pot-badge" id="pot-display">
      <span id="pot-status">Waiting...</span><br>
      <span id="pot-amount">₹0</span>
    </div>
  </div>

  <!-- Dynamic Seats Area -->
  <div id="seats-container"></div>

  <!-- Login Modal Overlay -->
  <div class="modal-overlay" id="login-modal">
    <div class="modal-card">
      <h2 class="title">ROYAL 3 PATTI</h2>
      
      <div class="tab-group">
        <button class="tab-btn active" id="tab-player">Player</button>
        <button class="tab-btn" id="tab-admin">Admin</button>
      </div>

      <input type="text" id="username-input" class="input-field" placeholder="Enter Name" autocomplete="off">
      <input type="password" id="password-input" class="input-field hidden" placeholder="Admin Password (admin)">

      <div id="error-msg" class="error-text"></div>

      <button class="action-submit-btn" id="login-submit-btn">JOIN TABLE</button>
    </div>
  </div>

  <!-- Bottom Action Controls -->
  <div class="bottom-action-bar">
    <button class="btn btn-pack" data-action="pack">PACK</button>
    <button class="btn btn-blind" data-action="blind">BLIND<br><small>(₹10)</small></button>
    <button class="btn btn-see" data-action="see">SEE CARDS</button>
    <button class="btn btn-chaal" data-action="chaal">CHAAL<br><small>(₹20)</small></button>
    <button class="btn btn-show" data-action="show">SHOW<br><small>(₹20)</small></button>
  </div>

  <script src="script.js"></script>
</body>
</html>
